services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: saas-app-prod
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env
    volumes:
      - app-storage:/var/www/storage
      - app-cache:/var/www/bootstrap/cache
    networks:
      - saas-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: saas-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - app-storage:/var/www/storage:ro
    networks:
      - saas-network
    depends_on:
      app:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: saas-db-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root_password}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${DB_USERNAME} -p${DB_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - saas-network

  redis:
    image: redis:alpine
    container_name: saas-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - saas-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: saas-worker-prod
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - app-storage:/var/www/storage
      - app-cache:/var/www/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - saas-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: saas-scheduler-prod
    restart: unless-stopped
    env_file:
      - .env
    command: php artisan schedule:work
    volumes:
      - app-storage:/var/www/storage
      - app-cache:/var/www/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - saas-network

networks:
  saas-network:
    driver: bridge

volumes:
  dbdata:
  redisdata:
  app-storage:
  app-cache: