services:
  init:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: saas-init
    restart: "no"
    working_dir: /var/www
    env_file: .env
    environment:
      DB_HOST: saas-db-prod
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME:-saas_user}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_RUN_INIT: "true"
      APP_CACHE_ROUTES: "false"
    volumes:
      - app-storage:/var/www/storage
    networks:
      - saas-network
    depends_on:
      saas-db-prod:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: saas-app-prod
    restart: unless-stopped
    working_dir: /var/www
    env_file: .env
    environment:
      DB_HOST: saas-db-prod
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME:-saas_user}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_RUN_INIT: "false"
    volumes:
      - app-storage:/var/www/storage
    networks:
      - saas-network
    depends_on:
      init:
        condition: service_completed_successfully
      saas-db-prod:
        condition: service_healthy
      redis:
        condition: service_started

  background-tasks:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: saas-worker-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: saas-db-prod
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME:-saas_user}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_RUN_INIT: "false"
    command: ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/conf.d/worker.conf"]
    volumes:
      - app-storage:/var/www/storage
    networks:
      - saas-network
    depends_on:
      init:
        condition: service_completed_successfully
      saas-db-prod:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: saas-nginx-prod
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - app-storage:/var/www/storage:ro
    networks:
      - saas-network
    depends_on:
      app:
        condition: service_started

  saas-db-prod:
    image: mysql:8.0
    container_name: saas-db-prod
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME:-saas_user}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${DB_USERNAME:-saas_user} -p$${DB_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - saas-network

  redis:
    image: redis:alpine
    container_name: saas-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - saas-network

networks:
  saas-network:
    driver: bridge

volumes:
  dbdata:
  redisdata:
  app-storage: