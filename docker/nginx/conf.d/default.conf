server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    # ============ HEADERS FOR REVERSE PROXY COMPATIBILITY ============
    # These are critical when running behind Apache/other reverse proxy
    # They prevent "Invalid URI: Host is malformed" errors
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-Port $server_port;

    # ============ STATIC ASSETS ============
    # Serve static assets directly (build files, storage, etc)
    location ~* ^/(build|storage|css|js|images)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ============ ROUTING ============
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ============ FAVICON & ROBOTS ============
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ============ ERROR HANDLING ============
    error_page 404 /index.php;

    # ============ PHP-FPM PROCESSING ============
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Important for reverse proxy
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $server_name;
        fastcgi_param HTTPS $http_x_forwarded_proto;
    }

    # ============ SECURITY: DENY SENSITIVE FILES ============
    # This is what the logs show with 403 errors - NORMAL & GOOD!
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ============ UPLOAD LIMITS ============
    client_max_body_size 20M;
}
